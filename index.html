<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joint Savings Tracker</title>
    <!-- Import Appwrite JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 50px;
        }

        /* Circular Graph Styling */
        .graph-container {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            /* The background creates the progress ring - default to 0% */
            background: conic-gradient(#ffffff 0%, #333333 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
            transition: background 0.5s ease-in-out;
        }

        .inner-circle {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .amount {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        .cycle-text {
            font-size: 12px;
            color: #888888;
            margin-top: 15px;
            max-width: 160px;
            line-height: 1.5;
        }

        /* Action Button */
        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #cccccc; }
        button:active { transform: scale(0.98); }

        #message {
            margin-top: 25px;
            height: 20px;
            font-size: 14px;
            color: #4caf50;
        }
    </style>
</head>
<body>

    <h2 id="greeting">Welcome</h2>
    <div class="subtitle">Joint Savings Dashboard</div>

    <!-- The Circular Graph -->
    <div class="graph-container" id="progress-circle">
        <div class="inner-circle">
            <p class="amount" id="savings-display">₱0</p>
            <p class="cycle-text">Savings cycle resets every 21st of the month</p>
        </div>
    </div>

    <!-- The 20 Peso Action Button -->
    <button id="save-btn" onclick="addJointSavings()">Put ₱20 in joint savings now</button>

    <div id="message"></div>

    <script src="app.js"></script>
</body>
</html>
